name = "ethikcorp-superbrain"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
account_id = "80114e86d2b31e6086ffa21c0ecda3ec"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "PREVIEW_WORKSPACES"
class_name = "PreviewWorkspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewWorkspace"]

[vars]
BUILD_ID = "2026-10-25-cloudflare-v1"

[observability]
enabled = false
