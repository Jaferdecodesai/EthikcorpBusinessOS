# Review-only worker. Do not use this file against ethikcorp-superbrain.
# It does not set SESSION_SECRET and does not reuse the production Durable Object namespace.
name = "ethikcorp-businessos-review"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PREVIEW_WORKSPACES"
class_name = "PreviewWorkspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewWorkspace"]

[vars]
BUILD_ID = "businessos-review-not-production"
