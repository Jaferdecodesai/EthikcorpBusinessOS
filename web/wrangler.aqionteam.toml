# Aqion team portal. Separate worker and Durable Object from ethikcorp-superbrain and from the customer portal.
# SESSION_SECRET is not in this file. Set it with: npx wrangler secret put SESSION_SECRET --config wrangler.aqionteam.toml
name = "ethikcorp-businessos-aqionteam"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PREVIEW_WORKSPACES"
class_name = "PreviewWorkspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PreviewWorkspace"]

[vars]
BUILD_ID = "businessos-aqionteam-v1"
PORTAL_MODE = "aqionteam"

[observability]
enabled = false
